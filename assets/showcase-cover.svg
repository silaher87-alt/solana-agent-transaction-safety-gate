<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Solana Agent Transaction Safety Gate</title>
  <desc id="desc">A visual showing an unsigned Solana transaction passing through decoding and policy checks to ALLOW, REVIEW, or BLOCK outcomes.</desc>
  <rect width="1600" height="900" fill="#0b1020"/>
  <rect x="70" y="70" width="1460" height="760" rx="36" fill="#11182a" stroke="#2a3552" stroke-width="2"/>
  <text x="120" y="165" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700">Solana Agent Transaction Safety Gate</text>
  <text x="120" y="225" fill="#b7c2d8" font-family="Arial, Helvetica, sans-serif" font-size="30">Read-only pre-signing inspection for unsigned Solana transactions</text>

  <rect x="120" y="340" width="300" height="150" rx="24" fill="#17213a" stroke="#536487" stroke-width="2"/>
  <text x="270" y="400" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Unsigned</text>
  <text x="270" y="442" text-anchor="middle" fill="#c4cee0" font-family="Arial, Helvetica, sans-serif" font-size="26">Solana transaction</text>

  <path d="M430 415 H555" stroke="#7083aa" stroke-width="6" stroke-linecap="round"/>
  <path d="M545 397 L568 415 L545 433" fill="none" stroke="#7083aa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="580" y="340" width="300" height="150" rx="24" fill="#17213a" stroke="#536487" stroke-width="2"/>
  <text x="730" y="400" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Decode + inspect</text>
  <text x="730" y="442" text-anchor="middle" fill="#c4cee0" font-family="Arial, Helvetica, sans-serif" font-size="24">Programs • accounts • actions</text>

  <path d="M890 415 H1015" stroke="#7083aa" stroke-width="6" stroke-linecap="round"/>
  <path d="M1005 397 L1028 415 L1005 433" fill="none" stroke="#7083aa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="1040" y="340" width="300" height="150" rx="24" fill="#17213a" stroke="#536487" stroke-width="2"/>
  <text x="1190" y="400" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Apply policy</text>
  <text x="1190" y="442" text-anchor="middle" fill="#c4cee0" font-family="Arial, Helvetica, sans-serif" font-size="24">Fail closed on ambiguity</text>

  <rect x="180" y="600" width="330" height="120" rx="24" fill="#102f28" stroke="#31d79b" stroke-width="3"/>
  <text x="345" y="655" text-anchor="middle" fill="#31d79b" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">ALLOW</text>
  <text x="345" y="693" text-anchor="middle" fill="#cfeee2" font-family="Arial, Helvetica, sans-serif" font-size="20">Configured checks passed</text>

  <rect x="635" y="600" width="330" height="120" rx="24" fill="#332a10" stroke="#f1b84b" stroke-width="3"/>
  <text x="800" y="655" text-anchor="middle" fill="#f1b84b" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">REVIEW</text>
  <text x="800" y="693" text-anchor="middle" fill="#f5e3b8" font-family="Arial, Helvetica, sans-serif" font-size="20">Unsupported or ambiguous</text>

  <rect x="1090" y="600" width="330" height="120" rx="24" fill="#351619" stroke="#ff6b72" stroke-width="3"/>
  <text x="1255" y="655" text-anchor="middle" fill="#ff6b72" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">BLOCK</text>
  <text x="1255" y="693" text-anchor="middle" fill="#ffd2d5" font-family="Arial, Helvetica, sans-serif" font-size="20">Blocking condition detected</text>

  <text x="800" y="785" text-anchor="middle" fill="#93a3c2" font-family="Arial, Helvetica, sans-serif" font-size="22">No wallet connection • No private keys • No signing • No broadcasting</text>
</svg>
