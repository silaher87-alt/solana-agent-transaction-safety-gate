name: CI

on:
  push:
    branches: [main, grant-readiness-20260926]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run acceptance suite
        run: npm test

      - name: Verify no signing/broadcast workflow
        run: npm run verify:no-signing
