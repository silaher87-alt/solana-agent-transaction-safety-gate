<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solana Agent Transaction Safety Gate</title><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 16px}textarea{width:100%;min-height:150px}pre{white-space:pre-wrap;background:#f4f4f4;padding:16px;border-radius:8px}label{display:block;margin:12px 0}button{padding:10px 16px;font-weight:600}.note{padding:12px;background:#fff8db;border:1px solid #eadb96;border-radius:8px}</style></head><body><h1>Solana Agent Transaction Safety Gate</h1><p class="note"><strong>Read-only MVP:</strong> this page does not accept private keys, sign transactions or broadcast them. Optional simulation uses Solana's read-only <code>simulateTransaction</code> RPC.</p><label>Unsigned Solana transaction (base64)<textarea id="tx" autocomplete="off" spellcheck="false"></textarea></label><label><input id="sim" type="checkbox"> Run read-only devnet simulation</label><button id="go">Analyse</button><h2>Result</h2><pre id="out">Waiting for input.</pre><script>document.getElementById('go').onclick=async()=>{const out=document.getElementById('out');out.textContent='Analysing…';try{const r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({base64Transaction:document.getElementById('tx').value.trim(),simulate:document.getElementById('sim').checked,policy:{maxSolSpendLamports:'100000000',maxTokenAmountRaw:'1000000',unknownProgram:'REVIEW',authorityChange:'BLOCK'}})});out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=String(e)}}</script></body></html>
